[package]
name = "s3"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
bincode = "1"
bytes = "1.12.1"
crc32c = "0.6.8"
crc32fast = "1.5.2"
crc64fast-nvme = "1.2.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "server-graceful"] }
libc = "0.2.190"
md-5 = "0.11.0"
mimalloc = "0.1.52"
multer = "3.1.0"
percent-encoding = "2.3.2"
redb = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time", "fs"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true
